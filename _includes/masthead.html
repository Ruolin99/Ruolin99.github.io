{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a href="{{ base_path }}/">
              <span class="lang-en">Ruolin Shi</span>
              <span class="lang-cn">石若琳</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">
                <span class="lang-en">{{ link.title }}</span>
                <span class="lang-cn">{{ link.title_cn | default: link.title }}</span>
              </a>
            </li>
          {% endfor %}
          <li id="lang-toggle" class="masthead__menu-item persist tail" style="margin-right: 0.4rem;">
            <a id="lang-toggle-btn" class="lang-toggle-pill" role="button" title="切换语言">
              <i class="fa-solid fa-globe" style="margin-right: 0.25rem;"></i><span class="lang-label">EN</span>
            </a>
          </li>
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
